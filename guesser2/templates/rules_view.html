<!DOCTYPE html>
<html>
<head>
    <title>清交Guesser - 規則說明</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 40px; }
        .content { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        h1 { text-align: center; }
        p { line-height: 1.6; }
        .button { display: inline-block; margin-top: 20px; padding: 12px 24px; background-color: #3498db; color: white; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="content">
        <h1>📘 規則說明</h1>
        <p><strong>1. 開始遊戲</strong><br>點選「開始遊戲」，然後選擇模式一或模式二。</p>
        <p><strong>2. 模式一：空間相對位置猜謎</strong><br>系統會顯示一張隱去路名的模糊地圖，透過綠色提示點與紅色目標點的位置關係來猜測目標地點名稱。</p>
        <p><strong>3. 模式二：步行時間線索猜謎</strong><br>系統會提供多個提示地標與目標地標之間的步行時間與距離，請根據這些線索猜出目標地標。</p>
        <p><strong>4. 答案判定</strong><br>輸入你猜測的建築物或地標名稱後，系統會判定是否正確並顯示得分與結果地圖。</p>
        <p><strong>5. 回到主選單</strong><br>完成一局後可點選返回主選單重新開始。</p>
        <div style="text-align:center;">
            <a href="/" class="button">返回主選單</a>
        </div>
    </div>
</body>
</html>
